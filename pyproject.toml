[project]
name = "mimeo"
version = "0.1.0"
description = "Provision and manage custom-domain sites on GitHub Pages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "requests>=2.31",
    "dnspython>=2.4",
]

[project.scripts]
mimeo = "mimeo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimeo"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.6.0",
    "ruff>=0.1.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "types-requests>=2.32.4.20260107",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
