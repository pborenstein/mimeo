[project]
name = "mimeo"
version = "0.1.0"
description = "A tool to generate websites quickly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.scripts]
mimeo = "mimeo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimeo"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.6.0",
    "ruff>=0.1.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
